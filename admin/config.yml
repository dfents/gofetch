backend:
  name: github
  repo: "dfents/gofetch"   # <-- replace with your actual owner/repo, e.g. "dfenton/gofetch"
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth

# Media (logo) uploads land in /images/logos and are referenced by that
# public path in data/domains.json — no separate media server needed.
media_folder: "images/logos"
public_folder: "/images/logos"

publish_mode: simple

collections:
  - name: "domains"
    label: "Domains"
    files:
      - name: "inventory"
        label: "Domain Inventory"
        file: "data/domains.json"
        description: "Every domain listed on GoFetch. Add, edit, or remove entries here — publishing triggers a site rebuild automatically."
        fields:
          - label: "Domains"
            name: "domains"
            widget: "list"
            summary: "{{fields.domain}} — {{fields.pricingMode}}"
            fields:
              - { label: "Domain (e.g. example.com)", name: "domain", widget: "string" }
              - { label: "Extension (e.g. com)", name: "extension", widget: "string" }
              - { label: "Logo (static image)", name: "logo", widget: "image", required: false, hint: "Optional. Used if no logo video is set." }
              - { label: "Logo (video, e.g. an animated mark)", name: "logoVideo", widget: "file", required: false, hint: "Optional mp4/webm. Takes priority over the static logo image on the lander page." }
              - { label: "Tagline", name: "tagline", widget: "string", required: false }
              - { label: "Description", name: "description", widget: "text", required: false }
              - { label: "Telegram handle included in this sale (optional, e.g. blackbadge -- no @)", name: "telegramHandle", widget: "string", required: false, hint: "Only set this when the domain is being sold together with a matching Telegram handle. Shows a distinct \"Includes @handle on Telegram\" badge on the lander, separate from the site's general Telegram contact button." }
              - label: "Categories"
                name: "category"
                widget: "list"
                field: { label: "Category", name: "value", widget: "string" }
              - label: "Acquisition mode"
                name: "pricingMode"
                widget: "select"
                options:
                  - { label: "Buy now (fixed price)", value: "buy_now" }
                  - { label: "Make offer", value: "make_offer" }
                  - { label: "Privately held", value: "private" }
              - { label: "Price (USD, leave blank for POA/private)", name: "price", widget: "number", required: false, value_type: "int" }
              - { label: "Show on homepage as Featured (max 6)", name: "featured", widget: "boolean", default: false }
              - { label: "Enable dedicated lander (renders when this domain's DNS points here)", name: "hasLander", widget: "boolean", default: true }
              - { label: "Year acquired", name: "acquired", widget: "number", required: false, value_type: "int" }
              - label: "Sale type"
                name: "saleType"
                widget: "select"
                required: false
                hint: "Optional merchandising tag, independent of Acquisition mode above. Set to Liquidation to show this domain in the homepage/Deals-page Liquidation & current deals section."
                options:
                  - { label: "None", value: "" }
                  - { label: "Liquidation", value: "liquidation" }

  - name: "bundles"
    label: "Bundles"
    files:
      - name: "bundles"
        label: "Domain Bundles"
        file: "data/bundles.json"
        description: "Sell two or more domains together as one listing (optionally paired with a Telegram handle). Each renders at /bundle.html?b=slug and appears in the Bundles strip on the Collection page."
        fields:
          - label: "Bundles"
            name: "bundles"
            widget: "list"
            summary: "{{fields.name}} — {{fields.pricingMode}}"
            fields:
              - { label: "Bundle name (shown as the listing title)", name: "name", widget: "string", required: false, hint: "Optional. If left blank, the domain names themselves are used as the title." }
              - { label: "Slug (used in the URL, e.g. blackbadge-bundle)", name: "slug", widget: "string" }
              - label: "Domains in this bundle"
                name: "domains"
                widget: "list"
                field: { label: "Domain", name: "value", widget: "string" }
              - { label: "Telegram handle included (optional, e.g. blackbadge -- no @)", name: "telegramHandle", widget: "string", required: false }
              - { label: "Description", name: "description", widget: "text", required: false }
              - label: "Acquisition mode"
                name: "pricingMode"
                widget: "select"
                options:
                  - { label: "Make offer", value: "make_offer" }
                  - { label: "Privately held", value: "private" }
                hint: "Bundles are sold via enquiry only -- AtomPay's instant checkout is tied to one specifically-owned domain, so Buy now isn't available here."
              - { label: "Price guide text (optional, e.g. \"From $5,000\")", name: "priceText", widget: "string", required: false }
              - { label: "Featured on homepage", name: "featured", widget: "boolean", default: false }

  - name: "picks"
    label: "Handpicked by Daniel"
    files:
      - name: "picks"
        label: "Handpicked Picks"
        file: "data/picks.json"
        description: "Names NOT in the GoFetch collection that Daniel is watching elsewhere (Atom, GoDaddy, Sedo, etc). Shown in the homepage's Handpicked by Daniel band, each linking out to the source listing."
        fields:
          - label: "Picks"
            name: "picks"
            widget: "list"
            summary: "{{fields.name}} — via {{fields.platform}}"
            fields:
              - { label: "Domain name", name: "name", widget: "string" }
              - { label: "Source platform (e.g. Atom, GoDaddy, Sedo)", name: "platform", widget: "string" }
              - label: "Status"
                name: "status"
                widget: "select"
                options:
                  - { label: "At auction", value: "auction" }
                  - { label: "Buy now", value: "buy_now" }
              - { label: "Note (why it caught your eye)", name: "note", widget: "text" }
              - { label: "Price or bid text, e.g. 1850 dollars, 3 bids", name: "price", widget: "string" }
              - { label: "Listing URL (link to the source platform)", name: "url", widget: "string" }
