<div id="enquiry-overlay" class="modal-overlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="enquiry-title">
    <div class="modal-head">
      <h3 id="enquiry-title" class="modal-title">Make an enquiry</h3>
      <button id="enquiry-close" class="modal-close" aria-label="Close">&times;</button>
    </div>
    <p class="modal-sub">We reply directly — no account, no mailing list.</p>
    <form id="enquiry-form" name="enquiry" method="POST" data-netlify="true" netlify-honeypot="enq-hp">
      <input type="hidden" name="form-name" value="enquiry">
      <input type="text" id="enq-hp" name="enq-hp" class="hp-field" tabindex="-1" autocomplete="off">
      <div class="field"><label for="enq-name">Name</label><input id="enq-name" name="name" type="text" required></div>
      <div class="field"><label for="enq-email">Email</label><input id="enq-email" name="email" type="email" required></div>
      <div class="field"><label for="enq-company">Company</label><input id="enq-company" name="company" type="text"></div>
      <div class="field"><label for="enq-domain">Domain</label><input id="enq-domain" name="domain" type="text"></div>
      <div class="field"><label for="enq-budget">Offer / budget</label><input id="enq-budget" name="budget" type="text"></div>
      <div class="field"><label for="enq-message">Message</label><textarea id="enq-message" name="message"></textarea></div>
      <button class="btn btn-primary" type="submit" style="width:100%;justify-content:center;">Send enquiry</button>
      <div id="enquiry-status" class="form-status" role="status"></div>
    </form>
  </div>
</div>
