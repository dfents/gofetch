[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Clean URLs: /collection instead of /collection.html
[[redirects]]
  from = "/collection"
  to = "/collection.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/lander"
  to = "/lander.html"
  status = 200

[[redirects]]
  from = "/liquidate"
  to = "/liquidate.html"
  status = 200
